<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مولدتي برو V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --input: #090c10;
            --primary: #2f81f7;
            --accent: #238636;
            --danger: #da3633;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --border: #30363d;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); direction: rtl; }
        
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 100px; }
        
        /* Header */
        .header { padding: 20px 16px; position: sticky; top: 0; background: var(--bg); z-index: 100; border-bottom: 1px solid var(--border); }
        .search-bar { width: 100%; background: var(--input); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: white; margin-top: 15px; outline: none; }

        /* Cards */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 12px 16px; transition: 0.2s; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        
        /* Tags */
        .tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-right: 8px; }
        .tag-house { background: rgba(47, 129, 247, 0.15); color: #58a6ff; }
        .tag-shop { background: rgba(210, 153, 34, 0.15); color: #d29922; }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { cursor: pointer; color: var(--text-dim); transition: 0.3s; }
        .nav-item.active { color: var(--primary); }

        /* Modal */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 2000; }
        .modal { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; border: 1px solid var(--border); }
        
        input, select { width: 100%; background: var(--input); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; margin: 10px 0; font-family: inherit; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: var(--text-dim); margin-top: 8px; }

        .debt-label { color: var(--danger); font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// أيقونات بدون إيموجي (SVG)
const Icons = {
    Home: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>,
    List: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>,
    Add: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
    User: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
};

function App() {
    const [tab, setTab] = useState('home');
    const [search, setSearch] = useState('');
    const [role, setRole] = useState('owner'); // 'owner' or 'worker'
    const [payModal, setPayModal] = useState(null);

    // قاعدة البيانات (LocalStorage)
    const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('m_recs')) || [
        { id: 1, name: 'فيز المولد الأول', hPrice: 10000, sPrice: 15000 }
    ]);
    const [subs, setSubs] = useState(() => JSON.parse(localStorage.getItem('m_subs')) || [
        { id: 1, name: 'حسن محمد', type: 'house', amps: 5, recordId: 1, isPaid: false, debt: 0 },
        { id: 2, name: 'سوبر ماركت الهدى', type: 'shop', amps: 10, recordId: 1, isPaid: false, debt: 0 }
    ]);

    useEffect(() => {
        localStorage.setItem('m_recs', JSON.stringify(records));
        localStorage.setItem('m_subs', JSON.stringify(subs));
    }, [records, subs]);

    // البحث
    const filteredSubs = useMemo(() => {
        return subs.filter(s => s.name.includes(search));
    }, [subs, search]);

    // تسجيل الدفع والديون
    const processPayment = (data) => {
        setSubs(prev => prev.map(s => {
            if (s.id === data.id) {
                let newDebt = s.debt;
                if (data.reason === 'shortage') {
                    newDebt += (data.required - data.paid);
                }
                return { ...s, isPaid: true, debt: newDebt };
            }
            return s;
        }));
        setPayModal(null);
    };

    return (
        <div className="container">
            <div className="header">
                <div className="flex-between">
                    <h2 style={{fontWeight: 900, color: 'var(--primary)'}}>مولدتي</h2>
                    <span style={{fontSize: '11px', background: '#30363d', padding: '4px 10px', borderRadius: '20px'}}>
                        {role === 'owner' ? 'المالك' : 'العامل'}
                    </span>
                </div>
                <input 
                    className="search-bar" 
                    placeholder="ابحث عن مشترك..." 
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                />
            </div>

            {tab === 'home' && (
                <div style={{paddingTop: '10px'}}>
                    {filteredSubs.map(sub => {
                        const rec = records.find(r => r.id === sub.recordId);
                        const price = sub.type === 'house' ? rec.hPrice : rec.sPrice;
                        const total = sub.amps * price;

                        return (
                            <div key={sub.id} className="card">
                                <div className="flex-between">
                                    <div>
                                        <div style={{display: 'flex', alignItems: 'center'}}>
                                            <span style={{fontWeight: 700}}>{sub.name}</span>
                                            <span className={`tag ${sub.type === 'house' ? 'tag-house' : 'tag-shop'}`}>
                                                {sub.type === 'house' ? 'بيت' : 'محل'}
                                            </span>
                                        </div>
                                        <div style={{fontSize: '13px', color: 'var(--text-dim)', marginTop: '5px'}}>
                                            {sub.amps} أمبير • المطلوب: {total.toLocaleString()} د.ع
                                        </div>
                                        {sub.debt > 0 && <div className="debt-label">دين سابق: {sub.debt.toLocaleString()} د.ع</div>}
                                    </div>
                                    <button 
                                        className="btn" 
                                        style={{width: 'auto', background: sub.isPaid ? 'rgba(35, 134, 54, 0.15)' : 'var(--primary)', color: sub.isPaid ? 'var(--accent)' : 'white'}}
                                        onClick={() => !sub.isPaid && setPayModal({...sub, required: total})}
                                    >
                                        {sub.isPaid ? 'تم' : 'دفع'}
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            )}

            {/* Modal الدفع */}
            {payModal && (
                <div className="modal-bg">
                    <div className="modal">
                        <h3 style={{marginBottom: '15px'}}>{payModal.name}</h3>
                        <div style={{background: 'rgba(47, 129, 247, 0.1)', padding: '12px', borderRadius: '10px', fontSize: '14px', marginBottom: '15px'}}>
                            الحساب: <b>{payModal.required.toLocaleString()} دينار</b>
                        </div>
                        
                        <label style={{fontSize: '12px', color: 'var(--text-dim)'}}>المستلم فعلياً</label>
                        <input id="p_val" type="number" defaultValue={payModal.required} onChange={(e) => {
                            const val = parseInt(e.target.value);
                            document.getElementById('r_sec').style.display = val < payModal.required ? 'block' : 'none';
                        }} />

                        <div id="r_sec" style={{display: 'none'}}>
                            <label style={{fontSize: '12px', color: 'var(--text-dim)'}}>السبب</label>
                            <select id="p_reason">
                                <option value="shortage">نقص (يُسجل كدين)</option>
                                <option value="discount">خصم (إعفاء)</option>
                            </select>
                        </div>

                        <button className="btn btn-primary" style={{marginTop: '15px'}} onClick={() => {
                            processPayment({
                                id: payModal.id,
                                paid: parseInt(document.getElementById('p_val').value),
                                required: payModal.required,
                                reason: document.getElementById('p_reason').value
                            });
                        }}>تأكيد العملية</button>
                        <button className="btn btn-ghost" onClick={() => setPayModal(null)}>إلغاء</button>
                    </div>
                </div>
            )}

            <div className="nav">
                <div className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}><Icons.Home /></div>
                <div className={`nav-item ${tab === 'recs' ? 'active' : ''}`} onClick={() => setTab('recs')}><Icons.List /></div>
                <div className={`nav-item ${tab === 'add' ? 'active' : ''}`} onClick={() => setTab('add')}><Icons.Add /></div>
                <div className={`nav-item ${tab === 'set' ? 'active' : ''}`} onClick={() => {setTab('set'); setRole(role === 'owner' ? 'worker' : 'owner')}}><Icons.User /></div>
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
